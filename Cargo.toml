[workspace]
resolver = "2"
members = ["core", "drivers", "cli", "kit", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
mousecfg-core = { path = "core" }
mousecfg-drivers = { path = "drivers" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
hidapi = "2.6"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
