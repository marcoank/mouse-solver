name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: python -I tools/test_analyze_capture.py
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: mouse-solver-windows
          path: |
            target/release/MouseSolver.exe
            target/release/mouse-solver.exe
            target/release/mouse-solver-kit.exe
