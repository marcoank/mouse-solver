# Famiglia G2 (Pixart). Da danexpo/o2ctl, lccpianoman/glor, Krodity/glorious-i2 (MIT).
name = "Glorious Model D 2 Wireless (cavo)"
vid = 0x093A
pid = 0x824A
driver = "glorious"
status = "experimental"
notes = "Il mouse non permette di rileggere le impostazioni: si vede l'ultimo stato scritto da questa app. Ogni scrittura attiva il profilo 1 e rimette lift-off, debounce, motion sync e colori degli stadi ai valori di fabbrica. Modello non provato: ID dalla tabella di OpenMouse."

[glorious]
family = "g2"
link = "cable"

[caps]
dpi_min = 100
dpi_max = 26000
dpi_step = 50
min_stages = 4
max_stages = 6
polling = [125, 250, 500, 1000]
zones = ["mouse"]
effects = ["static", "breathing", "spectrum", "off"]
