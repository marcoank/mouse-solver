# da pulsar-mouse-linux e Pulsar-X3-Web-Config (MIT): famiglia S, feature report da 64 byte. Provato con un X3 LHD (2000-8000 Hz misurati).
name = "Pulsar ricevitore 8K (Fusion2)"
vid = 0x3710
pid = 0x5403
driver = "pulsar"
status = "experimental"
notes = "Il mouse deve essere acceso e sveglio (muovilo prima di leggere o scrivere). Si usa sempre il profilo 1. Luci escluse: dipendono dal mouse collegato. Nessun comando di salvataggio documentato: dopo la prima modifica controlla che DPI e polling restino anche dopo aver scollegato il mouse. Chiudi Pulsar Fusion: quando parte riscrive le sue impostazioni."
notes_en = "The mouse must be on and awake (move it before reading or writing). Profile 1 is always used. Lighting excluded: it depends on the connected mouse. No save command is documented: after the first change, check that DPI and polling persist after unplugging the mouse. Close Pulsar Fusion: when it starts it rewrites its own settings."

[pulsar]
family = "pulsar_s"
read_profile = false
profiles = 6
led = false

[caps]
dpi_min = 100
dpi_max = 32000
dpi_step = 10
max_stages = 6
polling = [125, 250, 500, 1000, 2000, 4000, 8000]
zones = []
effects = []
