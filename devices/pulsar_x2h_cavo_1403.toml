# da pulsar-mouse-linux e Pulsar-X3-Web-Config (MIT): famiglia S, feature report da 64 byte. Comandi ereditati dall'X2A, mai provati su questo modello.
name = "Pulsar X2H (cavo)"
vid = 0x3710
pid = 0x1403
driver = "pulsar"
status = "experimental"
notes = "La zona dpi è il LED che indica lo stadio DPI: un colore unico viene scritto su tutti gli stadi. Nessun comando di salvataggio documentato: dopo la prima modifica controlla che DPI e polling restino anche dopo aver scollegato il mouse. Chiudi Pulsar Fusion: quando parte riscrive le sue impostazioni."

[pulsar]
family = "pulsar_s"
read_profile = true
profiles = 5
led = true

[caps]
dpi_min = 100
dpi_max = 26000
dpi_step = 100
max_stages = 6
polling = [125, 250, 500, 1000]
zones = ["dpi"]
effects = ["static", "breathing", "off"]
