# da ckb-next (GPL-2.0) e OpenRGB: famiglia Bragi. Solo il polling è documentato.
name = "Corsair M75 Wireless (Slipstream)"
vid = 0x1B1C
pid = 0x1BDC
driver = "corsair"
status = "experimental"
notes = "Su questa famiglia Corsair si può impostare solo il polling: stadi DPI e luci salvate non sono documentati. Serve una cattura col kit per aggiungerli."
notes_en = "On this Corsair family only polling can be set: DPI stages and saved lighting are not documented. A capture with the kit is needed to add them."

[corsair]
family = "bragi"
bragi_prefix = 0x09

[caps]
dpi_min = 0
dpi_max = 0
dpi_step = 1
min_stages = 0
max_stages = 0
polling = [125, 250, 500, 1000]
