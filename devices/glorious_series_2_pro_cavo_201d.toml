# Famiglia GP, mappa classic. Da korkje/mxw (MIT).
name = "Glorious Series 2 PRO (cavo)"
vid = 0x258A
pid = 0x201D
driver = "glorious"
status = "experimental"
notes = "Il mouse non permette di rileggere le impostazioni: si vede l'ultimo stato scritto da questa app. Ogni scrittura attiva il profilo 1. Sempre 4 stadi DPI. Modello non provato: secondo la tabella di Glorious CORE usa gli stessi comandi dei Model O/D Wireless. Polling non supportato: le velocità 2K-8K usano un comando non documentato per questo modello."

[glorious]
family = "gp"
link = "cable"
map = "classic"

[caps]
dpi_min = 100
dpi_max = 19000
dpi_step = 50
min_stages = 4
max_stages = 4
polling = []
zones = ["mouse"]
effects = ["static", "breathing", "spectrum", "off"]
