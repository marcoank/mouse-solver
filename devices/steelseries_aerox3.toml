# generato da tools/gen_steelseries.py da rivalcfg: non modificare a mano

name = "SteelSeries Aerox 3"
vid = 0x1038
pid = 0x1836
driver = "steelseries"
status = "experimental"
notes = "Questo mouse non permette di rileggere le impostazioni: l'app mostra le ultime scritte da qui. Usa Misura polling per controllare."
