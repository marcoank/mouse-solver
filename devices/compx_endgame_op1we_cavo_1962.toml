# Serie WE = protocollo CompX/Nordic come feature report, da xm2we-linux e OP1we-Control (MIT).
name = "Endgame Gear OP1we (cavo)"
vid = 0x3367
pid = 0x1962
driver = "compx"
status = "experimental"
notes = "4 stadi fissi; lo stadio attivo si cambia col tasto (la sua scrittura non è mai stata provata). CPI fino a 10000: oltre la codifica non è verificata. Nessuna luce configurabile. Il mouse si addormenta dopo pochi secondi: muovilo se non risponde."

[compx]
transport = "feature"
reply_id = 9
usage_page = 0xFF02
usage = 0x0002
write_stage_count = false

[caps]
dpi_min = 50
dpi_max = 10000
dpi_step = 50
min_stages = 4
max_stages = 4
active_stage_settable = false
polling = [125, 250, 500, 1000]
