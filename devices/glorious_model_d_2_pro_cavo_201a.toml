# Famiglia GP, mappa classic. Da korkje/mxw (MIT).
name = "Glorious Model D 2 PRO (cavo)"
vid = 0x258A
pid = 0x201A
driver = "glorious"
status = "experimental"
notes = "Il mouse non permette di rileggere le impostazioni: si vede l'ultimo stato scritto da questa app. Ogni scrittura attiva il profilo 1. Sempre 4 stadi DPI. Modello non provato: secondo la tabella di Glorious CORE usa gli stessi comandi dei Model O/D Wireless."
notes_en = "The mouse can't read its settings back: you see the last state written by this app. Every write activates profile 1. Always 4 DPI stages. Untested model: according to the Glorious CORE table it uses the same commands as the Model O/D Wireless."

[glorious]
family = "gp"
link = "cable"
map = "classic"

[caps]
dpi_min = 100
dpi_max = 19000
dpi_step = 50
min_stages = 4
max_stages = 4
polling = [125, 250, 500, 1000]
zones = ["mouse"]
effects = ["static", "breathing", "spectrum", "off"]
