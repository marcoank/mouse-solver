# da pulsar-mouse-linux e Pulsar-X3-Web-Config (MIT): famiglia S, feature report da 64 byte. Provato su hardware da entrambe le fonti.
name = "Pulsar X3 (cavo)"
vid = 0x3710
pid = 0x3409
driver = "pulsar"
status = "experimental"
notes = "L'X3 non ha LED. Si usa sempre il profilo 1 (sull'X3 la lettura del profilo attivo non risponde). Nessun comando di salvataggio documentato: dopo la prima modifica controlla che DPI e polling restino anche dopo aver scollegato il mouse. Chiudi Pulsar Fusion: quando parte riscrive le sue impostazioni."
notes_en = "The X3 has no LEDs. Profile 1 is always used (on the X3 reading the active profile gets no response). No save command is documented: after the first change, check that DPI and polling persist after unplugging the mouse. Close Pulsar Fusion: when it starts it rewrites its own settings."

[pulsar]
family = "pulsar_s"
read_profile = false
profiles = 6
led = false

[caps]
dpi_min = 100
dpi_max = 32000
dpi_step = 10
max_stages = 6
polling = [125, 250, 500, 1000]
zones = []
effects = []
