# Protocollo CompX/Nordic (famiglia N) da pulsar-mouse-linux e python-pulsar-mouse-tool (MIT).
# Lo stesso PID è usato da tutti i modelli "Fusion Wireless" su VID 0x3554.
name = "Pulsar X2V2 / Xlite V3 / X2A Wireless (cavo)"
vid = 0x3554
pid = 0xf507
driver = "compx"
status = "experimental"
notes = "Si modifica solo il profilo attivo. DPI oltre 10000 codificati come sul sensore 3395 (X2V2 Mini): sui modelli più vecchi col sensore 3370 tieniti sotto 10000. La spia DPI non c'è su tutti i modelli."
notes_en = "Only the active profile is changed. DPI above 10000 is encoded as on the 3395 sensor (X2V2 Mini): on older models with the 3370 sensor stay below 10000. Not all models have the DPI indicator."

[compx]
transport = "output"
reply_id = 8
interface = 1
write_stage_count = true
dpi_led = true

[caps]
dpi_min = 50
dpi_max = 26000
dpi_step = 50
min_stages = 1
max_stages = 4
polling = [125, 250, 500, 1000]
zones = ["dpi"]
effects = ["static", "breathing", "off"]
