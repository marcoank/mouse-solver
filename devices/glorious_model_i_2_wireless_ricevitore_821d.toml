# Famiglia G2 (Pixart). Da danexpo/o2ctl, lccpianoman/glor, Krodity/glorious-i2 (MIT).
name = "Glorious Model I 2 Wireless (ricevitore)"
vid = 0x093A
pid = 0x821D
driver = "glorious"
status = "experimental"
notes = "Il mouse non permette di rileggere le impostazioni: si vede l'ultimo stato scritto da questa app. Ogni scrittura attiva il profilo 1 e rimette lift-off, debounce, motion sync e colori degli stadi ai valori di fabbrica. Se è collegato anche il cavo, usa la voce (cavo): col cavo inserito il mouse ignora il ricevitore."
notes_en = "The mouse can't read its settings back: you see the last state written by this app. Every write activates profile 1 and resets lift-off, debounce, motion sync and stage colors to factory values. If the cable is also connected, use the (cavo) entry: with the cable plugged in the mouse ignores the receiver."

[glorious]
family = "g2"
link = "dongle"
cable_pid = 0x821A

[caps]
dpi_min = 100
dpi_max = 26000
dpi_step = 50
min_stages = 4
max_stages = 6
polling = [125, 250, 500, 1000]
zones = ["mouse"]
effects = ["static", "breathing", "spectrum", "off"]
