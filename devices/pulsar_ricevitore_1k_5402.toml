# da pulsar-mouse-linux e Pulsar-X3-Web-Config (MIT): famiglia S, feature report da 64 byte. Provato con un X3.
name = "Pulsar ricevitore 1K (Xlite v4, X2 v3, X2H v3, X2A v3, X3)"
vid = 0x3710
pid = 0x5402
driver = "pulsar"
status = "experimental"
notes = "Il mouse deve essere acceso e sveglio (muovilo prima di leggere o scrivere). Si usa sempre il profilo 1. Luci escluse: dipendono dal mouse collegato. Nessun comando di salvataggio documentato: dopo la prima modifica controlla che DPI e polling restino anche dopo aver scollegato il mouse. Chiudi Pulsar Fusion: quando parte riscrive le sue impostazioni."

[pulsar]
family = "pulsar_s"
read_profile = false
profiles = 6
led = false

[caps]
dpi_min = 100
dpi_max = 32000
dpi_step = 10
max_stages = 6
polling = [125, 250, 500, 1000]
zones = []
effects = []
